version: '3.8'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - chromadb_data:/chroma/.chroma/index

volumes:
  chromadb_data:

networks:
  default:
    driver: bridge
