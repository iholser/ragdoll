name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ragdoll
          POSTGRES_USER: ragdoll
          POSTGRES_PASSWORD: ragdoll
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
          
      chromadb:
        image: chromadb/chroma:0.5.0
        env:
          CHROMA_SERVER_HOST: 0.0.0.0
          CHROMA_SERVER_HTTP_PORT: 8000
        ports:
          - 8000:8000

    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 18
        
    - uses: pnpm/action-setup@v2
      with:
        version: 8
        
    - name: Install dependencies
      run: pnpm install
      
    - name: Build applications
      run: pnpm build
      
    - name: Setup database
      run: |
        cd docker
        psql -h localhost -U ragdoll -d ragdoll -f init-db.sql
      env:
        PGPASSWORD: ragdoll
        
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Start services
      run: |
        cd apps/agent-runtime && npm run dev &
        cd apps/admin-ui && npm run dev &
        sleep 30  # Wait for services to start
      
    - name: Run smoke tests
      run: pnpm test:e2e:smoke
      
    - name: Run E2E tests
      run: pnpm test:e2e
      
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
